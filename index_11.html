<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dubai Padel Club Tour, 1 October</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#15231F; --muted:#5B6B66; --line:#D5DED9;
  --turf:#1E5B4A; --turf-soft:#DCEBE4; --ball:#C9D62E; --ball-ink:#2B3000; --road:#B8C4BF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A17; --surface:#16241F; --ink:#E6EEEA; --muted:#98A9A3; --line:#2A3B35;
    --turf:#5FB396; --turf-soft:#1D3A31; --ball:#D8E34A; --ball-ink:#1B1F00; --road:#3A4C46;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A17; --surface:#16241F; --ink:#E6EEEA; --muted:#98A9A3; --line:#2A3B35;
  --turf:#5FB396; --turf-soft:#1D3A31; --ball:#D8E34A; --ball-ink:#1B1F00; --road:#3A4C46;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 48px}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:clamp(34px,6vw,56px);line-height:1;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px;max-width:62ch}
.switch{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:22px}
.switch button{font:600 15px "Barlow",sans-serif;border:0;background:transparent;color:var(--ink);padding:9px 18px;border-radius:999px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--turf);color:#fff}
.switch button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.summary{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 20px;color:var(--muted)}
.summary b{color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600;margin-right:4px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){.mapbox{position:static}}
svg{display:block;width:100%;height:auto}
.maplegend{font-size:13px;color:var(--muted);margin:6px 4px 2px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:600 15px "Barlow",sans-serif;background:var(--ball);color:var(--ball-ink);padding:11px 18px;border-radius:12px;margin:12px 4px 4px}
.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:64px 1fr;gap:14px;position:relative}
.stop::before{content:"";position:absolute;left:31px;top:0;bottom:0;width:2px;background:var(--line)}
.stop:first-child::before{top:22px}
.stop:last-child::before{bottom:auto;height:22px}
.time{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;text-align:center;position:relative;z-index:1}
.time span{display:inline-block;background:var(--bg);padding:6px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
.card.finish{background:transparent;border-style:dashed}
summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
.num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--turf);color:#fff;display:grid;place-items:center;font:700 15px "Barlow Condensed",sans-serif}
.finish .num{background:var(--ball);color:var(--ball-ink)}
.nm{font-weight:600;line-height:1.25}
.meta{font-size:13px;color:var(--muted)}
.tag{margin-left:auto;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--turf-soft);color:var(--turf);white-space:nowrap}
.tag.opt{background:transparent;border:1px solid var(--line);color:var(--muted)}
.body{padding:0 16px 14px 56px;color:var(--ink)}
.body p{margin:0 0 8px;max-width:60ch}
.body .look{color:var(--muted);font-size:14px}
.body a{color:var(--turf);font-weight:600}
.drive{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.notes{margin-top:34px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:14px;max-width:70ch}
.notes p{margin:0 0 8px}
@media (prefers-reduced-motion:no-preference){.route{stroke-dasharray:4000;stroke-dashoffset:4000;animation:draw 1.4s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}}
</style>

</head>
<body>
<div class="wrap">
  <h1>Dubai Padel Club Tour</h1>
  <p class="sub">Thursday, 1 October. Depart Dubai Sports City at 12:00 and finish back there. Tap a club for a short overview and what to look out for.</p>

  <div class="switch" role="group" aria-label="Route option">
    <button type="button" data-v="wide" aria-pressed="true">Full tour, 8 clubs</button>
    <button type="button" data-v="short" aria-pressed="false">Short tour, 5 clubs</button>
  </div>

  <div class="summary" id="summary"></div>

  <div class="grid">
    <div class="mapbox">
      <svg id="map" viewBox="0 0 400 560" role="img" aria-label="Route diagram"></svg>
      <p class="maplegend">Schematic, not to scale. The southern section (DSC and DIP) is compressed about 4&times;.</p>
      <a class="btn" id="gmaps" target="_blank" rel="noopener">Open route in Google Maps</a>
    </div>
    <ol class="stops" id="stops"></ol>
  </div>
</div>

<script>
const P = {
  paus:{name:"Paus Club",short:"Paus",area:"Umm Al Sheif / Al Wasl",lat:25.1370867,lng:55.202712,pid:"ChIJEaWpCQBrXz4RhlHI9gXIz8w",tier:"opt",
    about:"Wellness-first club where padel plays a supporting role: spa, hammam-style treatments, art therapy, morning sessions and its own caf\u00e9, The Eatery.",
    look:"Look at: how they monetise the time a guest spends around the court \u2014 spa, F&B, events."},
  wpa:{name:"WPA \u2014 World Padel Academy",short:"WPA",area:"Al Quoz 1",lat:25.1464136,lng:55.2423792,pid:"ChIJZ0hgg45pXz4RFSkePMHBglk",tier:"opt",
    about:"Academy model: 10 indoor air-conditioned courts, multi-level spectator areas, pro shop, coffee corner and kids' programmes.",
    look:"Look at: how group training and the kids' academy are run, and the spaces for parents."},
  edition:{name:"Padel Edition",short:"Padel Edition",area:"Al Quoz 1",lat:25.135857,lng:55.2311753,pid:"ChIJTRbP_oJpXz4RbPos2MobOjA",tier:"must",
    about:"Premium design, fitness classes, a strong caf\u00e9, social events and easy parking. Players single out the lighting, temperature and humidity.",
    look:"Look at: climate control and lighting as the benchmark, and how court and caf\u00e9 work together."},
  oxygen:{name:"Oxygen Padel Club",short:"Oxygen",area:"Al Quoz 4",lat:25.1201461,lng:55.2375119,pid:"ChIJQU2YQd1pXz4RuKFwKhMxKkg",tier:"opt",
    about:"Padel, gym, ice bath and massage, with food and drinks ordered from an iPad on court. Currently expanding; reviews mention parking, lighting and orders not arriving.",
    look:"Look at: the recovery area, and how on-court ordering works in practice."},
  central:{name:"Central Padel \u2014 Flagship",short:"Central Padel",area:"Al Quoz 3",lat:25.1286268,lng:55.2210618,pid:"ChIJ4fuJbv9pXz4RlV-KEiqt08c",tier:"opt",
    about:"High-energy flagship club with lights and music, a competitive ranking system and ranked groups, a gym with cold bath, a small caf\u00e9, pro shop and plenty of parking.",
    look:"Look at: the ranking system and ranked groups as a retention engine, and the coaching programme."},
  lob:{name:"The Lob Dubai",short:"The Lob",area:"Al Quoz 3",lat:25.1257592,lng:55.2203321,pid:"ChIJy1YoYj1hXz4RCVzckzg0ahY",tier:"must",
    about:"Bali-inspired look, padel plus wellness (yoga, sauna), regular social matches and a coffee shop next door.",
    look:"Look at: how a club becomes a place to spend time, not just a sports hall."},
  p700:{name:"700 Padel & Fitness Hub",short:"700 Padel",area:"Al Barsha 2",lat:25.1093578,lng:55.2213906,pid:"ChIJc41YCy5rXz4R-qe_kZOzz3Y",tier:"must",
    about:"The largest community on the list and a mature membership model: Pilates, yoga, strength classes, sauna and a caf\u00e9-restaurant.",
    look:"Look at: membership structure, class programme and member retention."},
  one:{name:"Padel One",short:"Padel One",area:"Dubai Investment Park 2",lat:24.9714209,lng:55.1906663,pid:"ChIJ9Zj5FiZzXz4RgtApFLO0GQ0",tier:"must",
    about:"Members-club feel, its own Pilates studio, free match video recording, pro shop and lounge.",
    look:"Look at: customer service, match recording and the booking flow."},
  start:{name:"Dubai Sports City",area:"Start",lat:25.0406,lng:55.2217,start:true},
  dsc:{name:"Dubai Sports City",area:"Finish",lat:25.0406,lng:55.2217,finish:true}
};

// [key, arrive, leave, drive minutes from previous stop]
const V = {
  wide:{stops:[
    ["start",null,"12:00",null],
    ["paus","12:25","12:55",25],["wpa","13:10","13:40",15],["edition","13:50","14:20",10],["oxygen","14:30","15:00",10],
    ["central","15:12","15:42",12],["lob","15:47","16:17",5],["p700","16:27","16:57",10],["one","17:22","18:00",25],["dsc","18:15",null,15]]},
  short:{stops:[
    ["start",null,"12:00",null],
    ["wpa","12:25","13:05",25],["edition","13:10","13:50",5],["oxygen","14:00","14:35",10],
    ["lob","14:45","15:25",10],["one","15:55","16:40",30],["dsc","16:55",null,15]]}
};

function proj(lat,lng){
  const x0=55.185,x1=55.25,k=Math.cos(25*Math.PI/180);
  const x=30+((lng-x0)*k)/((x1-x0)*k)*340;
  const top=25.152,br=25.10;
  const d = lat>=br ? (top-lat) : (top-br)+(br-lat)/4;
  return [x,30+d/0.088*490];
}

function gmapsUrl(keys){
  return "https://www.google.com/maps/dir/"+keys.map(k=>P[k].lat+","+P[k].lng).join("/")+"/data=!4m2!4m1!3e0";
}

function render(v){
  const cfg=V[v];
  document.querySelectorAll(".switch button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));
  const clubs=cfg.stops.filter(s=>!P[s[0]].finish&&!P[s[0]].start).length;
  const drive=cfg.stops.reduce((a,s)=>a+(s[3]||0),0);
  const last=cfg.stops[cfg.stops.length-1];
  document.getElementById("summary").innerHTML=
    `<span><b>${clubs}</b>clubs</span><span><b>${cfg.stops[0][2]}\u2013${last[1]}</b>total time</span><span><b>~${drive}</b>min driving</span>`;

  const svg=document.getElementById("map");
  const br=proj(25.10,55.19)[1];
  let s=`<line x1="10" y1="${br}" x2="390" y2="${br}" stroke="var(--line)" stroke-dasharray="4 6"/>
    <text x="388" y="${br-6}" text-anchor="end" font-size="11" fill="var(--muted)">\u2193 compressed</text>
    <text x="24" y="${proj(25.13,55.19)[1]}" font-size="12" fill="var(--muted)" font-weight="600">Al Quoz</text>
    <text x="24" y="${proj(25.005,55.19)[1]}" font-size="12" fill="var(--muted)" font-weight="600">South</text>`;
  Object.keys(P).forEach(k=>{
    if(P[k].start||P[k].finish) return;
    if(!cfg.stops.find(x=>x[0]===k)){const [x,y]=proj(P[k].lat,P[k].lng);
      s+=`<circle cx="${x}" cy="${y}" r="6" fill="none" stroke="var(--road)" stroke-width="2"/>`;}
  });
  const pts=cfg.stops.map(x=>proj(P[x[0]].lat,P[x[0]].lng));
  s+=`<polyline class="route" points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--turf)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  cfg.stops.forEach((x,i)=>{
    const p=P[x[0]];
    if(p.start) return; // drawn together with finish
    const [cx,cy]=pts[i],fin=p.finish;
    const right=cx<260;
    const label=fin?"Dubai Sports City":p.short;
    const sub=fin?`Start ${cfg.stops[0][2]} \u00b7 Finish ${x[1]}`:x[1];
    s+=`<g><circle cx="${cx}" cy="${cy}" r="13" fill="${fin?'var(--ball)':'var(--turf)'}" stroke="var(--surface)" stroke-width="3"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="14" font-weight="700" fill="${fin?'var(--ball-ink)':'#fff'}" font-family="Barlow Condensed,sans-serif">${fin?'\u2605':i}</text>
      <text x="${right?cx+20:cx-20}" y="${cy+4}" text-anchor="${right?'start':'end'}" font-size="12.5" font-weight="600" fill="var(--ink)">${label}</text>
      <text x="${right?cx+20:cx-20}" y="${cy+18}" text-anchor="${right?'start':'end'}" font-size="11" fill="var(--muted)">${sub}</text></g>`;
  });
  svg.innerHTML=s;

  document.getElementById("gmaps").href=gmapsUrl(cfg.stops.map(x=>x[0]));

  const ol=document.getElementById("stops");
  ol.innerHTML=cfg.stops.map((x,i)=>{
    const p=P[x[0]];
    const driveTxt=x[3]?`<div class="drive">\u2248 ${x[3]} min drive</div>`:"";
    if(p.start||p.finish){
      const t=p.start?x[2]:x[1];
      const meta=p.start?"Start, depart "+x[2]:"Finish";
      return `<li class="stop"><div class="time"><span>${t}</span></div><div>${driveTxt}<div class="card finish"><summary style="cursor:default"><span class="num">\u2605</span><span><span class="nm">${p.name}</span><br><span class="meta">${meta}</span></span></summary></div></div></li>`;
    }
    const link=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}&query_place_id=${p.pid}`;
    const tag=v==="wide"?"":(p.tier==="must"?'<span class="tag">Must-see</span>':'<span class="tag opt">If time allows</span>');
    return `<li class="stop"><div class="time"><span>${x[1]}</span></div><div>${driveTxt}
      <details class="card"${i===1?" open":""}><summary><span class="num">${i}</span>
      <span><span class="nm">${p.name}</span><br><span class="meta">${p.area}, ${x[1]}\u2013${x[2]}</span></span>${tag}</summary>
      <div class="body"><p>${p.about}</p><p class="look">${p.look}</p><p><a href="${link}" target="_blank" rel="noopener">Open in Google Maps</a></p></div></details></div></li>`;
  }).join("");
}

document.querySelectorAll(".switch button").forEach(b=>b.addEventListener("click",()=>{render(b.dataset.v);try{localStorage.setItem("v",b.dataset.v)}catch(e){}}));
let initial="wide";try{const s=localStorage.getItem("v");if(s&&V[s])initial=s}catch(e){}
render(initial);
</script>
</body>
</html>
