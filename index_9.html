<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Падел-тур по Дубаю, 1 октября</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#15231F; --muted:#5B6B66; --line:#D5DED9;
  --turf:#1E5B4A; --turf-soft:#DCEBE4; --ball:#C9D62E; --ball-ink:#2B3000; --road:#B8C4BF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A17; --surface:#16241F; --ink:#E6EEEA; --muted:#98A9A3; --line:#2A3B35;
    --turf:#5FB396; --turf-soft:#1D3A31; --ball:#D8E34A; --ball-ink:#1B1F00; --road:#3A4C46;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A17; --surface:#16241F; --ink:#E6EEEA; --muted:#98A9A3; --line:#2A3B35;
  --turf:#5FB396; --turf-soft:#1D3A31; --ball:#D8E34A; --ball-ink:#1B1F00; --road:#3A4C46;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 48px}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:clamp(34px,6vw,56px);line-height:1;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px;max-width:62ch}
.switch{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:22px}
.switch button{font:600 15px "Barlow",sans-serif;border:0;background:transparent;color:var(--ink);padding:9px 18px;border-radius:999px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--turf);color:#fff}
.switch button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.summary{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 20px;color:var(--muted)}
.summary b{color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600;margin-right:4px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){.mapbox{position:static}}
svg{display:block;width:100%;height:auto}
.maplegend{font-size:13px;color:var(--muted);margin:6px 4px 2px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:600 15px "Barlow",sans-serif;background:var(--ball);color:var(--ball-ink);padding:11px 18px;border-radius:12px;margin:12px 4px 4px}
.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:64px 1fr;gap:14px;position:relative}
.stop::before{content:"";position:absolute;left:31px;top:0;bottom:0;width:2px;background:var(--line)}
.stop:first-child::before{top:22px}
.stop:last-child::before{bottom:auto;height:22px}
.time{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;text-align:center;position:relative;z-index:1}
.time span{display:inline-block;background:var(--bg);padding:6px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
.card.finish{background:transparent;border-style:dashed}
summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
.num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--turf);color:#fff;display:grid;place-items:center;font:700 15px "Barlow Condensed",sans-serif}
.finish .num{background:var(--ball);color:var(--ball-ink)}
.nm{font-weight:600;line-height:1.25}
.meta{font-size:13px;color:var(--muted)}
.tag{margin-left:auto;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--turf-soft);color:var(--turf);white-space:nowrap}
.tag.opt{background:transparent;border:1px solid var(--line);color:var(--muted)}
.body{padding:0 16px 14px 56px;color:var(--ink)}
.body p{margin:0 0 8px;max-width:60ch}
.body .look{color:var(--muted);font-size:14px}
.body a{color:var(--turf);font-weight:600}
.drive{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.notes{margin-top:34px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:14px;max-width:70ch}
.notes p{margin:0 0 8px}
@media (prefers-reduced-motion:no-preference){.route{stroke-dasharray:4000;stroke-dashoffset:4000;animation:draw 1.4s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Падел-тур по Дубаю</h1>
  <p class="sub">Четверг, 1 октября. Старт в 13:00, финиш в Dubai Sports City. Нажмите на клуб, чтобы увидеть краткое описание и на что смотреть.</p>

  <div class="switch" role="group" aria-label="Вариант маршрута">
    <button type="button" data-v="wide" aria-pressed="true">Широкий, 7 клубов</button>
    <button type="button" data-v="short" aria-pressed="false">Короткий, 5 клубов</button>
  </div>

  <div class="summary" id="summary"></div>

  <div class="grid">
    <div class="mapbox">
      <svg id="map" viewBox="0 0 400 560" role="img" aria-label="Схема маршрута"></svg>
      <p class="maplegend">Схема без масштаба. Южный участок (DSC и DIP) сжат примерно в 4 раза.</p>
      <a class="btn" id="gmaps" target="_blank" rel="noopener">Открыть маршрут в Google Maps</a>
    </div>
    <ol class="stops" id="stops"></ol>
  </div>

</div>

<script>
const P = {
  paus:{name:"Paus Club",area:"Umm Al Sheif / Al Wasl",lat:25.1370867,lng:55.202712,pid:"ChIJEaWpCQBrXz4RhlHI9gXIz8w",tier:"opt",
    about:"Wellness-клуб, падел здесь вторичен: spa, процедуры в стиле хаммама, арт-терапия, утренние сессии, своё кафе The Eatery.",
    look:"Смотрим: как монетизируется время клиента вокруг корта: spa, F&B, ивенты."},
  wpa:{name:"WPA — World Padel Academy",area:"Al Quoz 1",lat:25.1464136,lng:55.2423792,pid:"ChIJZ0hgg45pXz4RFSkePMHBglk",tier:"opt",
    about:"Академическая модель: 10 крытых кортов с кондиционером, многоуровневые зоны для зрителей, pro shop, кофе-корнер, детские программы.",
    look:"Смотрим: организацию групповых тренировок и детской академии, зоны для родителей."},
  edition:{name:"Padel Edition",area:"Al Quoz 1",lat:25.135857,lng:55.2311753,pid:"ChIJTRbP_oJpXz4RbPos2MobOjA",tier:"must",
    about:"Премиальный дизайн, фитнес-классы, сильное кафе, социальные активности, удобная парковка. Игроки отдельно хвалят свет, температуру и влажность.",
    look:"Смотрим: микроклимат и свет как стандарт, связку корт + кафе."},
  oxygen:{name:"Oxygen Padel Club",area:"Al Quoz 4",lat:25.1201461,lng:55.2375119,pid:"ChIJQU2YQd1pXz4RuKFwKhMxKkg",tier:"opt",
    about:"Падел + зал + ice bath + массаж, заказ еды и напитков с iPad прямо на корте. Клуб расширяется, в отзывах жалобы на парковку, свет и доставку заказов.",
    look:"Смотрим: recovery-зону и то, как работает заказ с корта на практике."},
  lob:{name:"The Lob Dubai",area:"Al Quoz 3",lat:25.1257592,lng:55.2203321,pid:"ChIJy1YoYj1hXz4RCVzckzg0ahY",tier:"must",
    about:"Эстетика в стиле Бали, падел + wellness (йога, сауна), регулярные social matches, кофейня по соседству.",
    look:"Смотрим: как клуб становится местом для времяпрепровождения, а не просто залом."},
  p700:{name:"700 Padel & Fitness Hub",area:"Al Barsha 2",lat:25.1093578,lng:55.2213906,pid:"ChIJc41YCy5rXz4R-qe_kZOzz3Y",tier:"must",
    about:"Самое большое комьюнити из списка и развитая membership-модель: пилатес, йога, силовые классы, сауна, кафе-ресторан.",
    look:"Смотрим: структуру членства, классы, удержание клиентов."},
  one:{name:"Padel One",area:"Dubai Investment Park 2",lat:24.9714209,lng:55.1906663,pid:"ChIJ9Zj5FiZzXz4RgtApFLO0GQ0",tier:"must",
    about:"Ощущение members-club, своя Pilates-студия, бесплатная видеозапись матчей, pro shop, лаунж-зона.",
    look:"Смотрим: клиентский сервис, видеозапись матчей, флоу бронирования."},
  dsc:{name:"Dubai Sports City",area:"Финиш",lat:25.0406,lng:55.2217,finish:true}
};

const V = {
  wide:{label:"Широкий",stops:[
    ["paus","13:00","13:30",null],["wpa","13:45","14:15",15],["edition","14:25","14:55",10],["oxygen","15:05","15:35",10],
    ["lob","15:50","16:20",15],["p700","16:30","17:00",10],["one","17:25","18:05",25],["dsc","18:20",null,15]]},
  short:{label:"Короткий",stops:[
    ["wpa","13:00","13:40",null],["edition","13:45","14:25",5],["oxygen","14:35","15:10",10],
    ["lob","15:20","16:00",10],["one","16:30","17:15",30],["dsc","17:30",null,15]]}
};

function proj(lat,lng){
  const x0=55.185,x1=55.25,k=Math.cos(25*Math.PI/180);
  const x=30+((lng-x0)*k)/((x1-x0)*k)*340;
  const top=25.152,br=25.10;
  let d = lat>=br ? (top-lat) : (top-br)+(br-lat)/4;
  const y=30+d/0.088*490;
  return [x,y];
}

function gmapsUrl(keys){
  return "https://www.google.com/maps/dir/"+keys.map(k=>P[k].lat+","+P[k].lng).join("/")+"/data=!4m2!4m1!3e0";
}

function render(v){
  const cfg=V[v];
  document.querySelectorAll(".switch button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));
  const clubs=cfg.stops.filter(s=>!P[s[0]].finish).length;
  const drive=cfg.stops.reduce((a,s)=>a+(s[3]||0),0);
  document.getElementById("summary").innerHTML=
    `<span><b>${clubs}</b>клубов</span><span><b>13:00–${cfg.stops[cfg.stops.length-1][1]}</b>по времени</span><span><b>~${drive}</b>мин в дороге</span>`;

  // map
  const svg=document.getElementById("map");
  const br=proj(25.10,55.19)[1];
  let s=`<line x1="10" y1="${br}" x2="390" y2="${br}" stroke="var(--line)" stroke-dasharray="4 6"/>
    <text x="388" y="${br-6}" text-anchor="end" font-size="11" fill="var(--muted)">↓ масштаб сжат</text>
    <text x="24" y="${proj(25.13,55.19)[1]}" font-size="12" fill="var(--muted)" font-weight="600">Al Quoz</text>
    <text x="24" y="${proj(25.005,55.19)[1]}" font-size="12" fill="var(--muted)" font-weight="600">Юг</text>`;
  // all clubs faint
  Object.keys(P).forEach(k=>{
    if(!cfg.stops.find(x=>x[0]===k)){const [x,y]=proj(P[k].lat,P[k].lng);
      s+=`<circle cx="${x}" cy="${y}" r="6" fill="none" stroke="var(--road)" stroke-width="2"/>`;}
  });
  const pts=cfg.stops.map(x=>proj(P[x[0]].lat,P[x[0]].lng));
  s+=`<polyline class="route" points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--turf)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  cfg.stops.forEach((x,i)=>{
    const p=P[x[0]],[cx,cy]=pts[i],fin=p.finish;
    const right=cx<260;
    s+=`<g><circle cx="${cx}" cy="${cy}" r="13" fill="${fin?'var(--ball)':'var(--turf)'}" stroke="var(--surface)" stroke-width="3"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="14" font-weight="700" fill="${fin?'var(--ball-ink)':'#fff'}" font-family="Barlow Condensed,sans-serif">${fin?'★':i+1}</text>
      <text x="${right?cx+20:cx-20}" y="${cy+4}" text-anchor="${right?'start':'end'}" font-size="12.5" font-weight="600" fill="var(--ink)">${p.name.replace(" — World Padel Academy","").replace(" & Fitness Hub","").replace(" Dubai","")}</text>
      <text x="${right?cx+20:cx-20}" y="${cy+18}" text-anchor="${right?'start':'end'}" font-size="11" fill="var(--muted)">${x[1]}</text></g>`;
  });
  svg.innerHTML=s;

  document.getElementById("gmaps").href=gmapsUrl(cfg.stops.map(x=>x[0]));

  // list
  const ol=document.getElementById("stops");
  ol.innerHTML=cfg.stops.map((x,i)=>{
    const p=P[x[0]];
    const driveTxt=x[3]?`<div class="drive">≈ ${x[3]} мин на машине</div>`:"";
    if(p.finish) return `<li class="stop"><div class="time"><span>${x[1]}</span></div><div>${driveTxt}<div class="card finish"><summary style="cursor:default"><span class="num">★</span><span><span class="nm">${p.name}</span><br><span class="meta">Финиш</span></span></summary></div></div></li>`;
    const link=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}&query_place_id=${p.pid}`;
    const tag=v==="wide"?"":(p.tier==="must"?'<span class="tag">Обязательно</span>':'<span class="tag opt">По времени</span>');
    return `<li class="stop"><div class="time"><span>${x[1]}</span></div><div>${driveTxt}
      <details class="card"${i===0?" open":""}><summary><span class="num">${i+1}</span>
      <span><span class="nm">${p.name}</span><br><span class="meta">${p.area}, ${x[1]}–${x[2]}</span></span>${tag}</summary>
      <div class="body"><p>${p.about}</p><p class="look">${p.look}</p><p><a href="${link}" target="_blank" rel="noopener">Открыть в Google Maps</a></p></div></details></div></li>`;
  }).join("");
}

document.querySelectorAll(".switch button").forEach(b=>b.addEventListener("click",()=>{render(b.dataset.v);try{localStorage.setItem("v",b.dataset.v)}catch(e){}}));
let start="wide";try{const s=localStorage.getItem("v");if(s&&V[s])start=s}catch(e){}
render(start);
</script>
</body>
</html>
